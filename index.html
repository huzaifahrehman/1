${kpi(t('largest'),big.amount?money(big.amount):'—')}${kpi(t('trend'),tr==null?'—':(tr>0?'+':'')+tr+'%',tr>0?'r':'g')}</div>

function vSearch(){
 return`<div class="card"><input placeholder="🔍 ${t('find')}" value="${esc(q.t)}" oninput="A.q('t',this.value)">
<div class="two" style="grid-template-columns:1fr 1fr"><select onchange="A.q('type',this.value)"><option value="">—</option>${Object.keys(TY).map(k=>`<option value="${k}"${q.type===k?' selected':''}>${t(TY[k])}</option>`).join('')}</select>
<select onchange="A.q('cat',this.value)"><option value="">—</option>${catOpts(q.cat)}</select></div><div class="two" style="grid-template-columns:1fr 1fr;margin-top:8px"><input type="date" value="${q.from||''}" onchange="A.q('from',this.value)"><input type="date" value="${q.to||''}" onchange="A.q('to',this.value)"></div><div class="two" style="grid-template-columns:1fr 1fr;margin-top:8px"><input inputmode="decimal" placeholder="Min" value="${q.min||''}" oninput="A.q('min',this.value)"><input inputmode="decimal" placeholder="Max" value="${q.max||''}" oninput="A.q('max',this.value)"></div></div>

function recs(){
 const r=[];
 for(const k in all){const d=all[k];
  d.expenses.forEach(e=>r.push({ty:'Expense',n:e.note,c:e.category,a:e.amount,ds:`${k}-${String(e.day).padStart(2,'0')}`}));
  d.earnings.forEach(e=>e.amount>0&&r.push({ty:'Earning',n:e.name,c:'',a:e.amount,ds:k+'-01'}));
  d.deductions.forEach(e=>e.amount>0&&r.push({ty:'Deduction',n:e.name,c:'',a:e.amount,ds:k+'-01'}));
 }
 return r.sort((a,b)=>b.ds.localeCompare(a.ds));
}
function sr(){

 const f=recs().filter(r=>(!q.type||r.ty===q.type)&&(!q.cat||r.c===q.cat)&&(!s||(r.n+' '+catN(r.c)).toLowerCase().includes(s))&&(!q.from||r.ds>=q.from)&&(!q.to||r.ds<=q.to)&&(!q.min||r.a>=num(q.min))&&(!q.max||r.a<=num(q.max)));
 $('srn').textContent=`(${f.length}) ${money(f.reduce((x,r)=>x+(r.ty==='Earning'?r.a:-r.a),0))}`;
 el.innerHTML=f.slice(0,200).map(r=>`<div class="row"><div class="d"><div>${esc(r.n||t(TY[r.ty]))}</div><div class="lbl">${esc(t(TY[r.ty]))} · ${r.ds}${r.c?' · '+esc(catN(r.c)):''}</div></div><b class="${r.ty==='Earning'?'g':'r'}">${r.ty==='Earning'?'+':'-'}${money(r.a)}</b></div>`).join('')||`<div class="lbl">${t('none')}</div>`;
}

 document.documentElement.lang=S.lang;const rtl=['ur','ar'].includes(S.lang);document.documentElement.dir=rtl?'rtl':'ltr';

 if(view==='analytics')charts();if(view==='search')sr();
}

/* ---------- receipt scan ---------- */
const shrink=f=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(im.src);ok(c.toDataURL('image/jpeg',.8))};im.onerror=no;im.src=URL.createObjectURL(f)});
$('rc').onchange=async ev=>{
 const f=ev.target.files[0];ev.target.value='';if(!f)return;
 busy(true,t('analyzing'));
 try{
  const image=await shrink(f),tok=await user.getIdToken();
  const res=await fetch(CFG.WORKER,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify({image})});
  let data={};try{data=await res.json()}catch{}
  if(res.status===402){refreshUsage();toast(t('limit'));A.upgrade();return}
  if(!res.ok||!Array.isArray(data.items)||!data.items.length)throw new Error(data.error||'No items found');
  if(data.usage){usage=data.usage;try{localStorage.setItem('sl_usage_'+user.uid,JSON.stringify(usage))}catch{}render()}
  const n=new Date(),day=(n.getFullYear()===Y&&n.getMonth()===M)?n.getDate():1;
  review=data.items.map(it=>({on:true,day,note:String(it.name||it.item||'Item'),amount:num(it.price??it.amount??0),category:CATS.includes(it.category)?it.category:'Other'}));
  reviewTotal=num(data.grandTotal??data.total??0);
  openM(`<h2>${t('review')}</h2><div class="warn">⚠️ ${t('verify')}</div>${review.map((r,i)=>`<div class="row" style="flex-wrap:wrap"><input type="checkbox" style="width:auto" checked onchange="A.rv(${i},'on',this.checked)"><input style="flex:1" value="${esc(r.note)}" oninput="A.rv(${i},'note',this.value)"><select style="width:100%" onchange="A.rv(${i},'category',this.value)">${catOpts(r.category)}</select><input inputmode="decimal" style="width:100%" value="${r.amount.toFixed(2)}" oninput="A.rv(${i},'amount',this.value)"></div>`).join('')}<div id="rt" class="sub"></div><button class="btn" onclick="A.rvOk()">${t('addSel')}</button>`);
  A.rv();
 }catch(e){toast(t('scanFail')+': '+e.message)}finally{busy(false)}
};

/* ---------- actions ---------- */
window.A={
 view(v){view=v;render()},
 shift(d){M+=d;if(M<0){M=11;Y--}if(M>11){M=0;Y++}render()},
 nd(){sessionStorage.setItem('sl_nd',new Date().toDateString());render()},
 q(k,v){q[k]=v;sr()},
 close:closeM,
 lang(v){S.lang=v;saveSettings();render();if(screen==='app')A.settings()},
 cur(v){S.currency=v;saveSettings();render()},
 settings(){openM(`<h2>${t('settings')}</h2><div class="lbl">${t('lang')}</div>${langSel()}<div class="lbl" style="margin-top:8px">${t('cur')}</div><select onchange="A.cur(this.value)">${Object.keys(CUR).map(k=>`<option${k===S.currency?' selected':''}>${k}</option>`).join('')}</select><button class="btn alt" onclick="A.logout()">${t('signOut')}</button><button class="btn" onclick="A.close()">${t('done')}</button>`)},
 guest(){localStorage.setItem('sl_local','1');boot()},
 view2(s){screen=s;render()},
 back(){screen='welcome';render()},
 async auth(m){
  const e=$('em').value.trim(),p=$('pw').value;if(!e||!p)return;
  try{await(m==='up'?auth.createUserWithEmailAndPassword(e,p):auth.signInWithEmailAndPassword(e,p))}catch(x){$('ae').textContent=x.message}
 },
 async google(){
  const p=new firebase.auth.GoogleAuthProvider();
  try{if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)await auth.signInWithRedirect(p);else await auth.signInWithPopup(p)}catch(x){toast(x.message)}
 },
 async reset(){
  const e=$('em').value.trim();if(!e)return;
  try{await auth.sendPasswordResetEmail(e);toast('✓ '+e)}catch(x){$('ae').textContent=x.message}
 },
 async logout(){
  closeM();localStorage.removeItem('sl_local');
  if(user)await auth.signOut();else{user=null;boot()}
 },
 upgrade(){openM(`<h2>${t('upgrade')} ($2/mo)</h2><p>${t('upText')}</p><button class="btn" onclick="A.pay()">${t('pay')}</button>${user?`<button class="btn alt" onclick="A.watchAd()">🎬 ${t('watchAd')}</button>`:''}`)},
 async watchAd(){
  const bridge=window.AdBridge||(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.AdMob);
  if(!bridge){toast(t('adUnavailable'));return}
  busy(true,'…');
  try{
   if(bridge.showRewardVideoAd)await bridge.prepareRewardVideoAd?.({adId:CFG.ADMOB_REWARD_ID}).catch(()=>{}),await bridge.showRewardVideoAd();
   else if(bridge.showRewardedAd)await bridge.showRewardedAd();
   else throw new Error('no method');
   const token=await user.getIdToken();
   const res=await fetch(CFG.WORKER+'/grant',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:'{}'});
   const data=await res.json().catch(()=>({}));
   busy(false);
   if(!res.ok)return toast(data.error||t('adUnavailable'));
   if(data.usage){usage=data.usage;try{localStorage.setItem('sl_usage_'+user.uid,JSON.stringify(usage))}catch{}render()}
   toast(t('adThanks')+' (+1)');closeM();
  }catch{busy(false);toast(t('adUnavailable'))}
 },
 pay(){
  closeM();
  if(!user){screen='welcome';render();return}
  if(CFG.CHECKOUT.includes('YOUR_PRODUCT_ID'))return toast('Set CFG.CHECKOUT first');
  location.href=`${CFG.CHECKOUT}?checkout[custom][user_id]=${encodeURIComponent(user.uid)}&checkout[email]=${encodeURIComponent(user.email||'')}`;
 },
 line(ty,i,k,v){const x=mut()[ty][i];if(x)x[k]=k==='amount'?num(v):v},
 addLine(ty){mut()[ty].push({name:'',amount:0});render()},
 delLine(ty,i){mut()[ty].splice(i,1);render()},
 saveSalary(){mut();persist();toast('✓ '+t('saved'));render()},
 copyPrev(){
  const p=all[prevKey()];if(!p||!hasData(p))return toast(t('noPrev'));
  const d=mut();d.earnings=p.earnings.map(x=>({...x}));d.deductions=p.deductions.map(x=>({...x}));persist();render();toast('✓ '+t('saved'));
 },
 budget(v){mut().budget=Math.max(0,num(v));persist();render()},
 addExp(){
  const n=new Date(),dd=(n.getFullYear()===Y&&n.getMonth()===M)?n.getDate():1;
  openM(`<h2>${t('addExp')}</h2><form onsubmit="A.saveExp(event)"><input id="xa" inputmode="decimal" placeholder="${t('amount')}" autocomplete="off" required>
<div class="two"><select id="xc">${catOpts(localStorage.getItem('sl_lastcat')||'Food & Dining')}</select><input id="xd" type="number" min="1" max="${dim(Y,M)}" value="${dd}"></div>
<input id="xn" placeholder="${t('note')}"><button class="btn">${t('save')}</button></form>`);
  setTimeout(()=>$('xa')&&$('xa').focus(),100);
 },
 saveExp(e){
  e.preventDefault();const a=num($('xa').value);if(a<=0)return;
  const day=Math.min(dim(Y,M),Math.max(1,parseInt($('xd').value,10)||1)),c=$('xc').value;
  localStorage.setItem('sl_lastcat',c);
  const d=mut();d.expenses.push({id:uid(),day,category:c,note:$('xn').value.trim()||catN(c),amount:+a.toFixed(2)});d.expenses.sort((x,y)=>x.day-y.day);
  persist();closeM();toast('✓ '+money(a));render();
 },
 delExp(id){const d=mut();d.expenses=d.expenses.filter(e=>e.id!==id);persist();render()},
 scan(){if(!user)return toast(t('needSignIn'));$('rc').click()},
 rv(i,k,v){
  if(i!==undefined&&review[i])review[i][k]=k==='amount'?num(v):k==='on'?!!v:v;
  const sel=review.filter(r=>r.on).reduce((s,r)=>s+r.amount,0),bad=reviewTotal>0&&Math.abs(sel-reviewTotal)>0.5;
  $('rt').innerHTML=`${t('selected')}: <b>${money(sel)}</b>${reviewTotal>0?` · ${t('detected')}: <b class="${bad?'r':'g'}">${money(reviewTotal)}</b>`:''}`;
 },
 rvOk(){
  const d=mut();
  review.filter(r=>r.on&&r.amount>0).forEach(r=>d.expenses.push({id:uid(),day:r.day,category:r.category,note:r.note.trim()||catN(r.category),amount:+r.amount.toFixed(2)}));
  d.expenses.sort((a,b)=>a.day-b.day);persist();closeM();render();
 }
};
$('main').addEventListener('click',e=>{const b=e.target.closest('[data-del-exp]');if(b)A.delExp(b.dataset.delExp)});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

let TPL=jget('sl_tpl',null)||jget('salary_recurring_templates',[]).map(p=>({...p,from:ym()}));
let GOALS=jget('sl_goals',null)||jget('salary_savings_goals',[]).map(g=>({id:g.id||uid(),name:g.name,target:num(g.targetAmount),saved:num(g.currentAmount),date:g.targetDate||''}));
let ready=false,st=jget('sl_streak',{n:0,d:'',ts:0});
const sv=(k,v,p)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}if(user&&pro)db.ref(`users/${user.uid}/${p}`).set(v).catch(e=>toast(e.message))};
const cnt=()=>Object.values(all).reduce((s,d)=>s+d.expenses.length,0);
function streak(){const n=new Date(),y=new Date(n-864e5);st.ts=n.getTime();if(st.d!==n.toDateString()){st.n=st.d===y.toDateString()?st.n+1:1;st.d=n.toDateString()}try{localStorage.setItem('sl_streak',JSON.stringify(st))}catch{}}

/* recurring bills: generated once per template per month, never for months before the template existed */
function genRec(){
 if(!ready||!TPL.length)return;
 const rg=(all[ym()]||{}).rg||[];let ch=false;
 TPL.forEach(p=>{if(!p.active||p.from>ym()||rg.includes(p.id))return;
  const m=mut();(m.rg||(m.rg=[])).push(p.id);
  m.expenses.push({id:'rec_'+p.id,day:Math.min(dim(Y,M),Math.max(1,(p.day|0)||1)),category:p.category,note:p.name+' ↻',amount:num(p.amount)});ch=true});
 if(ch){mut().expenses.sort((a,b)=>a.day-b.day);persist()}
}
const _render=render;render=function(){if(screen==='app')genRec();_render()};
const _load=load;load=function(){
 ready=!user||!pro;_load();
};
window.loadPremiumExtras=b=>{
 watchCloud(b+'/tpl',s=>{TPL=arr(s.val());try{localStorage.setItem('sl_tpl',JSON.stringify(TPL))}catch{}render()});
 watchCloud(b+'/goals',s=>{GOALS=arr(s.val());try{localStorage.setItem('sl_goals',JSON.stringify(GOALS))}catch{}render()});
};

const gcalc=g=>{const n=new Date(),rem=Math.max(0,g.target-g.saved),pct=g.target>0?Math.min(100,Math.round(g.saved/g.target*100)):0;let req=0;
 if(g.date&&rem>0){const[y,m]=g.date.split('-').map(Number),mo=(y-n.getFullYear())*12+(m-1-n.getMonth());req=mo>0?rem/mo:rem}
 return{rem,pct,req,done:g.target>0&&rem===0}};
const gl=(g,i,ed)=>{const c=gcalc(g);return`<div style="margin-bottom:10px"><div class="row" style="border:0;padding:0"><b class="d">${esc(g.name)}</b><span class="y">${money(g.saved)} / ${money(g.target)}</span></div><div class="bar"><i style="width:${c.pct}%;background:${c.done?'var(--green)':'var(--brass)'}"></i></div><div class="lbl">${c.pct}% · ${money(c.rem)} ${t('left')}${c.req>0?` · ${money(c.req)}${t('perMonth')}`:''}</div>${ed?`<button class="lnk" onclick="A.gadd(${i})">+ ${t('addFunds')}</button><button class="lnk" onclick="A.gdel(${i})">✕</button>`:''}</div>`};

const _vHome=vHome;
vHome=function(){
 const n=new Date(),act=TPL.filter(p=>p.active),pd=Math.min(28,Math.max(1,S.payday|0||1));
 let np=new Date(n.getFullYear(),n.getMonth(),pd);if(n.getDate()>pd)np=new Date(n.getFullYear(),n.getMonth()+1,pd);
 const dl=Math.round((np-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5),hrs=st.ts?Math.floor((Date.now()-st.ts)/36e5):-1;
 const qa=`<div class="qa" style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px">${[['⚡','addExp','addExp'],['🤔','affordS','afford'],['📋','mrev','reviewM'],['🔁','bills','bills'],['🎯','goals','goals']].map(([i,k,f])=>`<button class="btn alt" style="margin:0;padding:8px 2px;font-size:10.5px;display:flex;flex-direction:column;align-items:center" onclick="A.${f}()"><span style="font-size:17px">${i}</span>${t(k)}</button>`).join('')}</div>`;
 const rh=`<div class="grid" style="grid-template-columns:repeat(3,1fr)">${kpi(t('streak'),'🔥 '+st.n+'d','y')}${kpi(t('lastLog'),hrs<0?'—':hrs<1?'now':hrs<24?hrs+'h':Math.floor(hrs/24)+'d')}${kpi(t('payday'),dl?dl+'d':'🎉')}</div>`;
 const gc=`<div class="card"><h2>🎯 ${t('goals')}<button class="lnk" onclick="A.goals()">›</button></h2>${GOALS.slice(0,2).map((g,i)=>gl(g,i,0)).join('')||`<div class="lbl">${t('none')}</div>`}</div>`;
 const bc=`<div class="card"><h2>🔁 ${t('bills')}<button class="lnk" onclick="A.bills()">›</button></h2>${act.length?`<div class="sub">${t('total')}: <b class="r">${money(sum(act))}</b></div>`+act.slice(0,3).map(p=>`<div class="row"><span class="d">${esc(p.name)} <span class="lbl">(${t('day')} ${p.day})</span></span><b class="r">${money(p.amount)}</b></div>`).join(''):`<div class="lbl">${t('none')}</div>`}</div>`;
 const h=_vHome(),i=h.indexOf('<button class="btn"');
 return h.slice(0,i)+qa+rh+h.slice(i)+gc+bc;
};

const _vSpend=vSpend;
vSpend=function(){
 const d=D(),by={},cb=d.cb||{};d.expenses.forEach(e=>by[e.category]=(by[e.category]||0)+e.amount);
 return _vSpend()+`<div class="card"><h2>${t('catBud')}</h2>${CATS.map((c,i)=>{const cap=cb[i]||0,sp=by[c]||0;return`<div style="margin-bottom:10px"><div class="row" style="border:0;padding:0"><span class="d">${esc(t('cats')[i])}</span><span class="lbl">${money(sp)} /</span><input inputmode="decimal" style="width:80px;text-align:end" placeholder="—" value="${cap||''}" onchange="A.cb(${i},this.value)"></div>${cap>0?`<div class="bar"><i style="width:${Math.min(100,Math.round(sp/cap*100))}%;background:${sp>cap?'var(--rust)':'var(--brass)'}"></i></div>`:''}</div>`}).join('')}</div>`;
};
A.cb=(i,v)=>{const d=mut(),n=num(v);d.cb=d.cb||{};if(n>0)d.cb[i]=n;else delete d.cb[i];persist();render()};

A.settings=()=>openM(`<h2>${t('settings')}</h2><div class="lbl">${t('lang')}</div>${langSel()}<div class="lbl" style="margin-top:8px">${t('cur')}</div><select onchange="A.cur(this.value)">${Object.keys(CUR).map(k=>`<option${k===S.currency?' selected':''}>${k}</option>`).join('')}</select><div class="lbl" style="margin-top:8px">${t('pd')}</div><select onchange="A.pd(this.value)">${Array.from({length:28},(_,i)=>`<option value="${i+1}"${(S.payday||1)===i+1?' selected':''}>${i+1}</option>`).join('')}</select><div class="grid" style="margin-top:8px"><button class="btn alt" style="margin:0" onclick="A.backup()">📥 ${t('backup')}</button><button class="btn alt" style="margin:0" onclick="A.restore()">📤 ${t('restore')}</button></div><button class="btn alt" onclick="A.logout()">${t('signOut')}</button><button class="btn" onclick="A.close()">${t('done')}</button>`);
A.pd=v=>{S.payday=Math.min(28,Math.max(1,parseInt(v,10)||1));saveSettings();render()};

/* afford */
A.afford=()=>{openM(`<h2>🤔 ${t('afford')}</h2><input id="fa" inputmode="decimal" placeholder="${t('amount')}" oninput="A.af()"><select id="fc">${catOpts('Shopping')}</select><div id="fr" class="card" style="margin-top:10px"></div><button class="btn" id="fl" onclick="A.afLog()" style="display:none">${t('logIt')}</button>`);A.af();setTimeout(()=>$('fa')&&$('fa').focus(),100)};
A.af=()=>{const a=num($('fa').value),c=calc(),after=c.rem-a,nd=after>0?after/c.left:0;
 $('fr').innerHTML=`<b>${a<=0?'—':after<0?t('vNo'):a<=c.safe?t('vOk'):t('vHigh')}</b><div class="sub">${t('safe')}: ${money(c.safe)}<br>${t('remaining')}: ${money(after)}<br>${t('newDaily')}: ${money(nd)}</div>`;$('fl').style.display=a>0?'block':'none'};
A.afLog=()=>{const a=num($('fa').value);if(a<=0)return;const c=$('fc').value,n=new Date(),day=(n.getFullYear()===Y&&n.getMonth()===M)?n.getDate():1,d=mut();
 d.expenses.push({id:uid(),day,category:c,note:catN(c),amount:+a.toFixed(2)});d.expenses.sort((x,y)=>x.day-y.day);persist();closeM();render();toast('✓ '+money(a))};

/* bills */
A.bills=()=>openM(`<h2>🔁 ${t('bills')}</h2>${TPL.map((p,i)=>`<div class="row"><input type="checkbox" style="width:auto" ${p.active?'checked':''} onchange="A.tg(${i},this.checked)"><div class="d"><div>${esc(p.name)}</div><div class="lbl">${esc(catN(p.category))} · ${t('day')} ${p.day}</div></div><b class="r">${money(p.amount)}</b><button class="lnk" onclick="A.tdel(${i})">✕</button></div>`).join('')||`<div class="lbl">${t('none')}</div>`}<form onsubmit="A.tadd(event)" style="margin-top:10px"><input id="bn" placeholder="${t('name')}" required><div class="two"><input id="ba" inputmode="decimal" placeholder="${t('amount')}" required><input id="bd" type="number" min="1" max="31" value="1"></div><select id="bc">${catOpts('Bills & Utilities')}</select><button class="btn">${t('add')}</button></form>`);
const tsv=()=>{sv('sl_tpl',TPL,'tpl');genRec();render();A.bills()};
A.tadd=e=>{e.preventDefault();const a=num($('ba').value);if(a<=0)return;TPL.push({id:uid(),name:$('bn').value.trim(),amount:+a.toFixed(2),category:$('bc').value,day:Math.min(31,Math.max(1,parseInt($('bd').value,10)||1)),active:true,from:ym()});tsv()};
A.tg=(i,v)=>{TPL[i].active=v;tsv()};
A.tdel=i=>{TPL.splice(i,1);tsv()};

/* goals */
A.goals=()=>openM(`<h2>🎯 ${t('goals')}</h2>${GOALS.map((g,i)=>gl(g,i,1)).join('')||`<div class="lbl">${t('none')}</div>`}<form onsubmit="A.gsave(event)" style="margin-top:10px"><input id="gn" placeholder="${t('name')}" required><div class="two" style="grid-template-columns:1fr 1fr"><input id="gt" inputmode="decimal" placeholder="${t('target')}" required><input id="gs" inputmode="decimal" placeholder="${t('savedSoFar')}"></div><input id="gd" type="month"><button class="btn">${t('add')}</button></form>`);
const gsv=()=>{sv('sl_goals',GOALS,'goals');render();A.goals()};
A.gsave=e=>{e.preventDefault();const tg=num($('gt').value);if(tg<=0)return;GOALS.push({id:uid(),name:$('gn').value.trim(),target:+tg.toFixed(2),saved:+num($('gs').value).toFixed(2),date:$('gd').value||''});gsv()};
A.gadd=i=>{const v=num(prompt(t('addFunds'),'1000'));if(v>0){GOALS[i].saved=+(GOALS[i].saved+v).toFixed(2);gsv()}};
A.gdel=i=>{GOALS.splice(i,1);gsv()};

/* monthly review + multi-page PDF */
function rev(){
 const d=D(),c=calc(d),by={};d.expenses.forEach(e=>by[e.category]=(by[e.category]||0)+e.amount);
 const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0],big=d.expenses.reduce((m,e)=>e.amount>m.amount?e:m,{amount:0,note:''}),pv=all[prevKey()],ps=pv?sum(pv.expenses):null;
 return[[t('net'),money(c.net)],[t('spent'),money(c.spent)],[t('remain'),money(c.rem)],[t('savings'),(c.net>0?Math.max(0,Math.round((c.net-c.spent)/c.net*100)):0)+'%'],[t('top'),top?`${catN(top[0])} (${Math.round(top[1]/c.spent*100)}%)`:'—'],[t('count'),d.expenses.length],[t('largest'),big.amount?`${big.note}: ${money(big.amount)}`:'—'],[t('vsLast'),ps==null?'—':(c.spent>=ps?'+':'-')+money(Math.abs(c.spent-ps))]];
}
A.reviewM=()=>openM(`<h2>📋 ${t('mrevT')} · ${esc(mLabel())}</h2>${rev().map(([k,v])=>`<div class="row"><span class="d lbl">${k}</span><b>${esc(v)}</b></div>`).join('')}<button class="btn" onclick="A.pdf()">📄 ${t('exp')}</button>`);
A.pdf=async()=>{
 if(!window.html2canvas||!window.jspdf)return toast('PDF library not loaded');
 if(!pro&&pdfUsed()>=3)return toast(t('pdfLimit'));
 const d=D(),div=document.createElement('div'),td='border-bottom:1px solid #ddd;padding:5px';
 div.style.cssText='position:fixed;left:-9999px;top:0;width:620px;padding:24px;background:#fff;color:#000;font:12px Arial,sans-serif';div.dir=document.documentElement.dir;
 div.innerHTML=`<h2 style="margin:0 0 8px">${esc(t('app'))} · ${esc(mLabel())}</h2><table style="width:100%;border-collapse:collapse">${rev().map(([k,v])=>`<tr><td style="${td}">${k}</td><td style="${td}"><b>${esc(v)}</b></td></tr>`).join('')}</table><h3>${t('spending')}</h3><table style="width:100%;border-collapse:collapse">${d.expenses.map(e=>`<tr><td style="${td}">${e.day}</td><td style="${td}">${esc(catN(e.category))}</td><td style="${td}">${esc(e.note)}</td><td style="${td};text-align:end">${money(e.amount)}</td></tr>`).join('')}</table>`;
 document.body.appendChild(div);
 try{const cv=await html2canvas(div,{scale:2}),pdf=new window.jspdf.jsPDF('p','mm','a4'),pw=210,pp=Math.floor(cv.width*297/pw);
  for(let y=0,i=0;y<cv.height;y+=pp,i++){const h=Math.min(pp,cv.height-y),pc=document.createElement('canvas');pc.width=cv.width;pc.height=h;pc.getContext('2d').drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);if(i)pdf.addPage();pdf.addImage(pc.toDataURL('image/jpeg',.92),'JPEG',0,0,pw,h*pw/cv.width)}
  pdf.save(`Ledger_${ym()}.pdf`);if(!pro)localStorage.setItem(pdfUsageKey(),String(pdfUsed()+1));render()}catch(e){toast(e.message)}finally{div.remove()}
};

/* backup / restore */
A.backup=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({v:2,ledger:all,tpl:TPL,goals:GOALS,settings:S})],{type:'application/json'}));a.download=`ledger_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
const ri=document.createElement('input');ri.type='file';ri.accept='.json';ri.hidden=true;document.body.appendChild(ri);
A.restore=()=>ri.click();
ri.onchange=async ev=>{
 const f=ev.target.files[0];ev.target.value='';if(!f)return;
 try{const b=JSON.parse(await f.text());if(!b.ledger||typeof b.ledger!=='object')throw 0;if(!confirm(t('restore')+'?'))return;
  for(const k in b.ledger)if(/^\d{4}-\d{2}$/.test(k)){all[k]=norm(b.ledger[k]);persist(k)}
  if(Array.isArray(b.tpl)){TPL=b.tpl;sv('sl_tpl',TPL,'tpl')}if(Array.isArray(b.goals)){GOALS=b.goals;sv('sl_goals',GOALS,'goals')}
  closeM();render();toast('✓ '+t('restored'))}catch{toast(t('badFile'))}
};

/* streak: count only when an expense was really added */
['saveExp','rvOk','afLog'].forEach(n=>{const f=A[n];A[n]=function(...a){const c=cnt();f.apply(A,a);if(cnt()>c){streak();render()}}});
if($('main').innerHTML)render();
